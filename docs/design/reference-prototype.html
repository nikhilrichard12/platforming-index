<title>Platforming Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy client bar, tabbed workspace on the left, assistant docked on the right. One light look by choice. */
:root{
  color-scheme:light;
  --navy:#0A2540; --blue:#1F5FBF; --blue-soft:#EAF1FB; --ink:#16202E; --muted:#5C6B7F; --line:#DDE3EA; --subtle:#F5F7FA; --white:#FFFFFF;
  --amber:#8A5300; --amber-soft:#FFF3D9; --green:#0B6B50; --green-soft:#E3F4EE;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--white)}
body{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar{background:var(--navy);color:#fff}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding-block:12px}
.bar b{font-size:16px;font-weight:600;letter-spacing:.01em}
.bar .client{padding-left:16px;border-left:1px solid rgba(255,255,255,.3);font-weight:500}
.bar .meta{display:flex;flex-wrap:wrap;gap:6px 24px;margin-left:auto;font-size:12.5px;color:#D5DEEA;align-items:center}
.bar .meta span b{font-size:12.5px;color:#fff;font-weight:500}
.bar select{background:#12365C;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:4px;min-height:32px;padding:0 8px}
.tabs{border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tabs a{padding:13px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--navy);border-bottom-color:var(--blue)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding-block:22px;align-items:start}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-size:20px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.panel{border:1px solid var(--line);border-radius:4px;background:var(--white);min-width:0}
.panel>header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--subtle);display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pad{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:4px}
.kpi{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;cursor:pointer;min-width:0}
.kpi:first-child{border-left:0}
.kpi:hover{background:var(--subtle)}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .ask,.link{color:var(--blue);font-size:12px;font-weight:500;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.two{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:18px;align-items:stretch}
.gauge{display:flex;flex-direction:column;align-items:center;gap:2px}
.gauge .n{font-size:40px;font-weight:600;color:var(--navy);margin-top:-46px;line-height:1}
.gauge .c{font-size:12px;color:var(--muted)}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:14px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.path div{padding:9px 10px;font-size:12px;border-left:1px solid var(--line);color:var(--muted)}
.path div:first-child{border-left:0}
.path .on{background:var(--blue-soft);color:var(--navy);font-weight:500}
.path small{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 14px;background:var(--subtle);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child>td{border-bottom:0}
.num{text-align:right}
.mono{font-family:var(--mono);font-size:12.5px}
.track{height:6px;background:var(--line);border-radius:3px;min-width:70px}
.track i{display:block;height:100%;background:var(--blue);border-radius:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.b{background:var(--blue-soft);color:var(--blue)}
.cite{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--blue);background:var(--blue-soft);border:0;border-radius:3px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--subtle);border-radius:3px;padding:1px 6px;white-space:nowrap}
.btn{min-height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:500}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.field{min-height:36px;padding:0 10px;border-radius:4px;border:1px solid var(--line);background:var(--white);width:100%}
textarea.field{padding:8px 10px;min-height:64px}
label{font-size:12.5px;font-weight:500;display:flex;flex-direction:column;gap:5px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--white);padding:0 12px;min-height:36px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.rowbtn{background:none;border:0;padding:0;cursor:pointer;font-weight:500;text-align:left;color:var(--ink)}
.rowbtn:hover{color:var(--blue)}
.sub-table td,.sub-table th{font-size:12.5px;padding:7px 12px}
.inset{background:var(--subtle);padding:10px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:4px}
.grid3>div{padding:12px 14px;border-left:1px solid var(--line)}
.grid3>div:first-child{border-left:0}
.grid3 .v{font-size:22px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.note{font-size:12.5px;color:var(--muted)}
/* assistant */
.asst{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);min-height:420px}
.asst>header{flex:none}
.thread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.msg{padding:9px 12px;border-radius:4px;max-width:94%;overflow-wrap:anywhere}
.msg.a{background:var(--subtle);border:1px solid var(--line);align-self:flex-start}
.msg.u{background:var(--navy);color:#fff;align-self:flex-end}
.msg p{margin:0 0 7px}.msg p:last-child{margin:0}
.msg ul{margin:0 0 7px;padding-left:18px}.msg li{margin-bottom:3px}
.sugg{padding:0 14px 10px;display:flex;flex-direction:column;gap:5px;flex:none}
.askrow{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex:none}
.askrow .field{flex:1;min-width:0}
.status{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);background:var(--subtle);flex:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.dot.off{background:var(--amber)}
dialog{border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--ink);padding:0;max-width:min(500px,92vw);width:100%}
dialog::backdrop{background:rgba(10,37,64,.45)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0;padding:14px}
dt{color:var(--muted)}dd{margin:0;font-weight:500;overflow-wrap:anywhere}
@media (max-width:1020px){
  .work{grid-template-columns:minmax(0,1fr)}
  .asst{position:static;max-height:none}
  .thread{max-height:420px}
}
@media (max-width:700px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .two,.form{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .grid3>div{border-left:0;border-top:1px solid var(--line)}
  .grid3>div:first-child{border-top:0}
  .bar .meta{margin-left:0}
}
</style>

const SHARED = G.filter(g=>g.products>=2), CORE = G.filter(g=>g.products>=5);
const GAP = SHARED.reduce((a,g)=>a+g.gap,0), SPEND = G.reduce((a,g)=>a+g.spend,0);
const isRev = r => /SEE DWG/.test(r.desc);
const REVIEW = G.flatMap(g=>g.rows.filter(isRev).map(r=>({g,r})));
const REUSED = G.reduce((a,g)=>a+g.rows.filter(r=>r.products.length>1).length,0);
const MULTI = G.filter(g=>g.suppliers>=2).length;
const SUPPLIERS = new Set(G.flatMap(g=>g.rows.map(r=>r.supplier))).size;
const HOURS = PM.reduce((a,p)=>a+p[4],0);
const find = s => G.find(g=>g.name.toLowerCase().includes(s));
const cite = r => `<button type="button" class="cite" data-po="${r.po}">${r.po}</button>`;
const byGap = [...SHARED].sort((a,b)=>b.gap-a.gap), top3 = byGap.slice(0,3);
const fan = find("axial fan"), cap = find("dc link capacitor");
const state = { view:"dashboard", role:"cfo", filter:"all", q:"", open:null, check:null, exception:false, chat:[], turns:[], busy:false };
let sample = null, live = false, ctl = null;

/* ---------- roles ---------- */
const ROLES = {
  cfo:{ name:"CFO", lens:"cash, spend, margin and payback. Speak in dollars per year.",
    beliefs:"Customers do not need every variant. Engineering owns architecture decisions. Nobody is measured on complexity.",
    sugg:["Where is the biggest price gap?","What would it take to capture the price gap?","Which of these numbers are still assumptions?"],
    kpis:[
      { v:usd(GAP), l:"Yearly price gap on shared parts", q:"Why is the yearly price gap on shared parts "+usd(GAP)+"?", why:()=>`<p>Voltara buys the same part at different prices depending on which product line orders it. If every line paid the lowest price Voltara already gets, spend drops by ${usd(GAP)} a year, ${(GAP/SPEND*100).toFixed(1)}% of ${usd(SPEND)}.</p><p>Largest gaps: ${top3.map(g=>`${esc(g.name)} (${usd(g.gap)})`).join(", ")}. ${cite(top3[0].rows[0])} ${cite(top3[0].rows[top3[0].rows.length-1])}</p><p>This is a gap, not booked savings. Capturing it needs supplier negotiation and engineering sign-off.</p>` },
      { v:String(PNS-PARTS), l:"Duplicate part numbers carried", q:"Why do we carry "+(PNS-PARTS)+" duplicate part numbers, and what do they cost?", why:()=>`<p>${PNS} part numbers describe ${PARTS} real parts, so ${PNS-PARTS} are duplicates. Each one has its own stock, orders, and records.</p><p>The yearly cost per duplicate depends on your carrying cost. That stays an assumption until finance sets it.</p><p>Example: one fan has ${fan.rows.length} part numbers. ${fan.rows.slice(0,3).map(cite).join(" ")}</p>` },
      { v:px(cap.min)+" to "+px(cap.max), l:"One capacitor, three suppliers", q:"Why do we pay three different prices for the DC link capacitor?", why:()=>`<p>The ${esc(cap.name)} comes from ${cap.suppliers} suppliers. ${cap.rows.map(r=>`${r.products.join(" and ")} pays ${px(r.price)} at ${esc(r.supplier)}`).join("; ")}.</p><p>Moving all volume to the lowest price closes a ${usd(cap.gap)} yearly gap on this one part. ${cap.rows.map(cite).join(" ")}</p>` },
      { v:usd(SPEND), l:"Yearly parts spend in scope", q:"What makes up the "+usd(SPEND)+" yearly parts spend?", why:()=>`<p>${usd(SPEND)} covers every purchase order for the six products from Nov 2025 to Oct 2026, including spare and warranty buys.</p><p>${SHARED.length} of ${PARTS} parts are shared across products. Those carry the ${usd(GAP)} price gap.</p><p>Source: <span class="src">voltara_spend_cube.csv</span></p>` }
    ]},
  eng:{ name:"Engineering", lens:"engineering hours, part count, validation effort and design reuse.",
    beliefs:"Customers do not need every variant. Nobody owns architecture decisions. Nobody is measured on complexity.",
    sugg:["Which parts fit a common core?","What do I need to review?","Why does one fan have six part numbers?"],
    kpis:[
      { v:HOURS.toLocaleString("en-US")+" hrs", l:"Sustaining hours per year", q:"Where do the "+HOURS.toLocaleString("en-US")+" sustaining hours a year go?", why:()=>`<p>The six products log ${HOURS.toLocaleString("en-US")} sustaining hours a year. The modular UPS takes the most at 3,400. <span class="src">product_master</span></p><p>Every duplicate part number adds drawings, qualifications, and change orders. The data does not split hours by cause, so the share tied to duplicates is unknown.</p>` },
      { v:PNS+" → "+PARTS, l:"Part numbers versus real parts", q:"Why do "+PNS+" part numbers map to only "+PARTS+" real parts?", why:()=>`<p>Each product team numbered and named parts its own way. ${PNS} part numbers describe ${PARTS} real parts.</p><p>Example: ${esc(fan.name)} appears under ${fan.rows.length} part numbers. ${fan.rows.slice(0,3).map(cite).join(" ")}</p>` },
      { v:String(CORE.length), l:"Parts that fit a common core", q:"Which "+CORE.length+" parts fit a common core, and why?", why:()=>`<p>${CORE.length} parts appear in five or six of the six products, including the control board, gate driver, auxiliary power supply, heatsink, and fan.</p><p>Those are the first candidates for a shared core on the next generation. Each needs an engineering check that one spec covers every product. ${fan.rows.slice(0,2).map(cite).join(" ")}</p>` },
      { v:String(REVIEW.length), l:"Lines waiting for your review", q:"Which "+REVIEW.length+" lines need engineering review, and why?", why:()=>`<p>${REVIEW.length} parts list lines on the battery cabinet say only "SEE DWG". Text matching cannot confirm those, so a person checks the drawing.</p><p>Until you approve them they stay out of every savings figure. ${REVIEW.slice(0,3).map(x=>cite(x.r)).join(" ")}</p>` }
    ]},
  supply:{ name:"Supply chain", lens:"suppliers, pooled volume, unit price and negotiation leverage.",
    beliefs:"Customers do not need every variant. Nobody owns architecture decisions. Nobody is measured on complexity.",
    sugg:["Where should I negotiate first?","Why does the battery cabinet pay more?","Which parts have the most suppliers?"],
    kpis:[
      { v:usd(GAP), l:"Yearly price gap to negotiate", q:"Where does the "+usd(GAP)+" price gap come from, and where should I negotiate first?", why:()=>ROLES.cfo.kpis[0].why() },
      { v:Math.round((fan.max/fan.min-1)*100)+"%", l:"Premium paid by the smallest line", q:"Why does the smallest product line pay "+Math.round((fan.max/fan.min-1)*100)+"% more for the same fan?", why:()=>`<p>The battery cabinet buys the ${esc(fan.name)} at ${px(fan.max)}. The 1 kVA rack UPS buys the same fan at ${px(fan.min)}. ${cite(fan.rows[0])} ${cite(fan.rows[fan.rows.length-1])}</p><p>The cabinet orders small volumes under its own part number, so it never gets the pooled price.</p>` },
      { v:MULTI+" of "+PARTS, l:"Parts with two or more suppliers", q:"Why are "+MULTI+" of "+PARTS+" parts bought from more than one supplier?", why:()=>`<p>${MULTI} of the ${PARTS} real parts come from more than one supplier, mostly because each product team sourced separately.</p><p>Pooling volume under one part number gives one negotiation per part. ${cap.rows.slice(0,3).map(cite).join(" ")}</p>` },
      { v:String(SUPPLIERS), l:"Suppliers in scope", q:"Which suppliers carry the most spend?", why:()=>`<p>${SUPPLIERS} suppliers serve the six products. <span class="src">voltara_spend_cube.csv</span></p><p>Consolidating duplicate part numbers concentrates volume with fewer of them, part by part.</p>` }
    ]},
  sales:{ name:"Sales", lens:"lead time, product variety and what customers will notice.",
    beliefs:"Customers need every variant. Product management owns architecture decisions. Nobody is measured on complexity.",
    sugg:["Will any product or option go away?","How does this affect lead time?","What stays unique to each product?"],
    kpis:[
      { v:String(PARTS-SHARED.length), l:"Parts unique to one product", q:"Which parts stay unique to one product, and does consolidation touch them?", why:()=>`<p>${PARTS-SHARED.length} of ${PARTS} parts belong to a single product: enclosures, battery packs, MPPT boards. Those carry the differences customers see.</p><p>Consolidation targets the other ${SHARED.length}, such as screws, fans, and control boards.</p>` },
      { v:String(SHARED.length), l:"Shared parts customers never see", q:"What are the "+SHARED.length+" shared parts, and would a customer notice a change?", why:()=>`<p>${SHARED.length} parts appear in two or more products. They are internal components such as fans, fuses, terminal blocks, and hardware.</p><p>Changing their part numbers or supplier does not change what you sell. ${fan.rows.slice(0,2).map(cite).join(" ")}</p>` },
      { v:"3 to 14 wks", l:"Lead time across the line", q:"Why does lead time run from 3 to 14 weeks across the line?", why:()=>`<p>Lead time runs from 3 weeks on the rack UPS to 14 weeks on the battery cabinet. <span class="src">product_master</span></p><p>The cabinet waits on parts it orders in small lots under its own numbers. Pooled stock shortens that wait. The size of the improvement is not in the data yet.</p>` },
      { v:"6 of 6", l:"Products kept in the plan", q:"Does this plan remove any product or option?", why:()=>`<p>The plan keeps all six products. Step 1 changes what Voltara pays. Step 2 changes part numbers. Neither changes what you sell.</p><p>Step 3 applies to the next generation, where new variants start from a shared core.</p>` }
    ]}
};

/* ---------- dashboard ---------- */
function gauge(v){
  const a = Math.PI*(1-v/100), x = 90+70*Math.cos(a), y = 90-70*Math.sin(a);
  return `<svg viewBox="0 0 180 100" width="200" role="img" aria-label="Index score ${v} of 100"><path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="#DDE3EA" stroke-width="14" stroke-linecap="round"/><path d="M20 90 A70 70 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="#1F5FBF" stroke-width="14" stroke-linecap="round"/></svg>`;
}
function vDash(){
  const R = ROLES[state.role], mx = byGap[0].gap;
  const dims = [
    ["Shared architecture", 18, `${REUSED} of ${PNS} part numbers reused across products`, "Parts data"],
    ["Decision ownership", 40, "Functions name different owners", "Survey"],
    ["Incentives", 28, "No function reports a complexity target", "Survey"],
    ["Complexity control", 50, "No data yet on new part numbers per year", "Midpoint"]
  ];
  return `
  <div><h1>${R.name} dashboard</h1><p class="sub">Click any number to ask the assistant why.</p></div>
  <div class="kpis">${R.kpis.map((k,i)=>`<button type="button" class="kpi" data-kpi="${i}"><span class="l">${k.l}</span><span class="v">${k.v}</span><span class="ask">Ask why</span></button>`).join("")}</div>
  <div class="two">
    <section class="panel"><header><span class="eyebrow">Platforming Index</span><span class="badge">Provisional</span></header>
      <div class="pad"><div class="gauge">${gauge(34)}<div class="n">34</div><div class="c">of 100. Sharing parts, not yet a platform.</div></div>
        <div class="path"><div class="on"><small>Step 1 · now</small>Cut cost on today's products</div><div><small>Step 2</small>Consolidate duplicate parts</div><div><small>Step 3</small>Common core plus modules</div></div></div>
    </section>
    <section class="panel"><header><span class="eyebrow">Score by dimension</span><span class="note">Equal weights</span></header>
      <div class="scroll"><table><thead><tr><th>Dimension</th><th class="num">Score</th><th style="width:90px"></th><th>Basis</th><th>Source</th></tr></thead><tbody>
      ${dims.map(d=>`<tr><td style="white-space:nowrap"><b style="font-weight:500">${d[0]}</b></td><td class="num">${d[1]}</td><td><div class="track"><i style="width:${d[1]}%"></i></div></td><td>${d[2]}</td><td><span class="src">${d[3]}</span></td></tr>`).join("")}
      </tbody></table></div>
    </section>
  </div>
  <section class="panel"><header><span class="eyebrow">Largest price gaps on shared parts</span><a class="link" href="#parts" style="text-decoration:none">All ${PARTS} parts</a></header>
    <div class="scroll"><table><thead><tr><th>Part</th><th class="num">Part numbers</th><th class="num">Products</th><th class="num">Suppliers</th><th>Unit price paid</th><th class="num">Yearly gap</th><th style="width:14%"></th><th></th></tr></thead><tbody>
    ${byGap.slice(0,8).map(g=>`<tr><td><b style="font-weight:500">${esc(g.name)}</b></td><td class="num">${g.rows.length}</td><td class="num">${g.products}</td><td class="num">${g.suppliers}</td><td>${px(g.min)} to ${px(g.max)}</td><td class="num">${usd(g.gap)}</td><td><div class="track"><i style="width:${Math.round(g.gap/mx*100)}%"></i></div></td><td><button type="button" class="link" data-askpart="${g.id}">Ask why</button></td></tr>`).join("")}
    </tbody></table></div>
  </section>
  <p class="note">Sample company and sample data. Score method and peer benchmark are provisional. A price gap is not booked savings.</p>`;
}

/* ---------- parts ---------- */
function partRows(g){
  return `<tr><td colspan="6" style="padding:0"><div class="inset"><div class="scroll"><table class="sub-table"><thead><tr><th>Part number</th><th>Named in this product as</th><th>Product</th><th>Supplier</th><th class="num">Avg unit price</th><th>Source</th></tr></thead><tbody>
  ${g.rows.map(r=>`<tr><td class="mono">${esc(r.pn)}</td><td>${esc(r.desc)} ${isRev(r)?'<span class="badge">Needs review</span>':''}</td><td>${r.products.join(", ")}</td><td>${esc(r.supplier)}</td><td class="num">${px(r.price)}</td><td>${cite(r)}</td></tr>`).join("")}
  </tbody></table></div><p class="note" style="margin:8px 0 0">A match is a suggestion. Engineering approves before one part replaces another.</p></div></td></tr>`;
}
function vParts(){
  const f = state.filter, q = state.q.trim().toLowerCase();
  let list = [...G].sort((a,b)=>b.gap-a.gap);
  if (f==="shared") list = list.filter(g=>g.products>=2);
  if (f==="core") list = list.filter(g=>g.products>=5);
  if (f==="review") list = list.filter(g=>g.rows.some(isRev));
  if (q) list = list.filter(g=>g.name.toLowerCase().includes(q) || g.rows.some(r=>r.pn.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q)));
  const seg = (id,t) => `<button type="button" data-filter="${id}" aria-pressed="${f===id}">${t}</button>`;
  return `
  <div><h1>${PNS} part numbers, ${PARTS} real parts</h1><p class="sub">Each product team named and numbered the same part its own way. Open a part to see every version and what each product pays.</p></div>
  <div class="tools"><input class="field" style="flex:1 1 240px;width:auto" id="partSearch" type="search" placeholder="Search part, part number, or description" value="${esc(state.q)}" aria-label="Search parts">
    <div class="seg" role="group" aria-label="Filter">${seg("all","All "+PARTS)}${seg("shared","Shared "+SHARED.length)}${seg("core","Core candidates "+CORE.length)}${seg("review","Needs review "+REVIEW.length)}</div></div>
  <section class="panel"><div class="scroll"><table><thead><tr><th>Part</th><th>Category</th><th class="num">Part numbers</th><th class="num">Products</th><th>Unit price paid</th><th class="num">Yearly gap</th></tr></thead><tbody>
    ${list.length ? list.map(g=>`<tr><td><button type="button" class="rowbtn" data-open="${g.id}" aria-expanded="${state.open===g.id}">${state.open===g.id?"▾":"▸"} ${esc(g.name)}</button></td><td>${esc(g.cat)}</td><td class="num">${g.rows.length}</td><td class="num">${g.products}</td><td>${g.min===g.max?px(g.min):px(g.min)+" to "+px(g.max)}</td><td class="num">${g.gap>0?usd(g.gap):""}</td></tr>${state.open===g.id?partRows(g):""}`).join("") : `<tr><td colspan="6">No parts match that search.</td></tr>`}
  </tbody></table></div></section>`;
}

/* ---------- alignment ---------- */

  const cols = ["CEO","CFO","Engineering","Sales","Supply chain"];
  const T = [
    { q:"Do customers need every variant we sell?", a:["Mostly","No","No","Yes","No"], split:true,
      d:`${PARTS-SHARED.length} of ${PARTS} parts are unique to one product. The other ${SHARED.length} are shared parts customers never see.`, n:"Agree which differences customers pay for." },
    { q:"Who owns product architecture decisions?", a:["Engineering","Engineering","Nobody","Product mgmt","Nobody"], split:true,
      d:`Six products use six part-numbering schemes. One fan carries ${fan.rows.length} part numbers. ${fan.rows.slice(0,2).map(cite).join(" ")}`, n:"Name one owner for cross-product part decisions." },
    { q:"Is anyone measured on product complexity?", a:["No","No","No","No","No"], split:false,
      d:`Nobody reports a target. Kearney's 2026 survey found the same at 52% of companies that platform at scale.`, n:"Add one complexity measure to one team's goals." }
  ];
  return `
  <div><h1>Where the functions disagree</h1><p class="sub">Survey answers side by side with what the data shows. Built for running the client meeting.</p></div>

    <div class="scroll"><table><thead><tr><th>Question</th>${cols.map(c=>`<th>${c}</th>`).join("")}<th>Status</th></tr></thead><tbody>
    ${T.map(t=>`<tr><td><b style="font-weight:500">${t.q}</b></td>${t.a.map(x=>`<td>${x}</td>`).join("")}<td>${t.split?'<span class="badge">Split</span>':'<span class="badge g">Agreed gap</span>'}</td></tr>`).join("")}

  <section class="panel"><header><span class="eyebrow">Evidence and decisions</span></header>
    <div class="scroll"><table><thead><tr><th>Question</th><th>What the data shows</th><th>Decision to make</th></tr></thead><tbody>
    ${T.map(t=>`<tr><td style="width:26%">${t.q}</td><td>${t.d}</td><td style="width:26%"><b style="font-weight:500">${t.n}</b></td></tr>`).join("")}
    </tbody></table></div></section>`;
}

/* ---------- new part check ---------- */
const AB = {scr:"screw",mach:"machine",cap:"capacitor",res:"resistor",conn:"connector",brd:"board",ctrl:"control",hs:"heatsink",xfmr:"transformer",ind:"inductor",term:"terminal",blk:"block",sens:"sensor",temp:"temperature",elec:"electrolytic",pwr:"power"};
const toks = s => s.toLowerCase().replace(/[_,()\-]/g," ").replace(/(\d)\s+(mm|v|vdc|a|uf|w|k)\b/g,"$1$2").split(/\s+/).filter(Boolean).map(w=>AB[w]||w).map(w=>w.replace(/^24v$/,"24vdc"));
function match(q){
  const a = toks(q); let best=null, score=0;
  for (const g of G){ const b = toks(g.name); const s = a.filter(w=>b.includes(w)).length + (a.some(w=>b.includes(w)&&/\d/.test(w))?0.5:0); if (s>score){score=s;best=g;} }
  return score>=2 ? best : null;
}
function vNew(){
  const c = state.check; let out = "";
  if (c){
    const g = c.g;
    if (!g) out = `<section class="panel"><header><span class="eyebrow">Platforming Index check</span><span class="badge g">No match</span></header><div class="pad">Nothing in the parts lists looks like this request. The new part goes to normal approval.</div></section>`;
    else { const b = g.rows[0], save = Math.max(0,(g.max-g.min)*c.vol);
      out = `<section class="panel" style="border-color:var(--blue)"><header style="background:var(--blue-soft)"><span class="eyebrow" style="color:var(--blue)">Platforming Index check</span><span class="badge b">Voltara already buys this part</span></header>
        <div class="pad" style="display:flex;flex-direction:column;gap:12px">
          <div><b style="font-size:15px;font-weight:600">${esc(g.name)}</b></div>
          <div class="grid3"><div><div class="v">${g.rows.length}</div><div class="note">existing part numbers</div></div><div><div class="v">${px(g.min)}</div><div class="note">best price, ${esc(b.supplier)}</div></div><div><div class="v">${usd(save)}</div><div class="note">per year versus the highest price paid</div></div></div>
          <div>Reuse <span class="mono">${esc(b.pn)}</span> from ${b.products.join(", ")}. ${cite(b)} A new number makes ${g.rows.length+1} part numbers for one part and lowers the Complexity control score. Engineering confirms fit before any swap.</div>
          ${state.exception ? `<label>Why does this product need its own part?<textarea class="field" id="exReason" placeholder="Technical reason"></textarea></label><div class="tools"><button type="button" class="btn p" data-act="sendEx">Send for approval</button></div>`
            : `<div class="tools"><button type="button" class="btn p" data-act="reuse">Reuse existing part</button><button type="button" class="btn" data-act="ex">Request an exception</button></div>`}
          ${c.done?`<div><span class="badge g" style="font-size:12.5px;padding:5px 9px">${c.done}</span></div>`:""}
        </div></section>`; }
  }
  return `
  <div><h1>New part check</h1><p class="sub">This check appears inside the procurement system when an engineer requests a new part. Shown here on a mock requisition.</p></div>
  <section class="panel"><header><span class="eyebrow">Procurement system · Requisition REQ-2026-1184</span><span class="note">Mock screen</span></header>
    <form class="pad form" id="reqForm">
      <label class="full">Part description<input class="field" id="reqDesc" type="text" value="${esc(c?c.q:"Fan, axial, 120 mm, 24 VDC")}"></label>
      <label>Product<select class="field" id="reqProd"><option>VBS-50 StorLine Battery Cabinet</option><option>VMX-20 ModuLine Modular UPS</option><option>VSI-10 SunLine Solar Inverter</option></select></label>
      <label>Units per year<input class="field" id="reqVol" type="number" min="1" value="${c?c.vol:1800}"></label>
      <div class="full"><button class="btn p" type="submit">Create part number</button></div>
    </form></section>
  ${out}`;
}

/* ---------- assistant ---------- */
function context(){
  const R = ROLES[state.role];
  const parts = G.map(g=>`${g.name} | ${g.rows.length} part numbers | ${g.products} products | ${g.suppliers} suppliers | yearly gap $${g.gap} | yearly spend $${g.spend} :: `+g.rows.map(r=>`${r.pn} (${r.products.join("+")}, "${r.desc}", ${px(r.price)}, ${r.supplier}, [${r.po}])`).join("; ")).join("\n");
  return `You are the assistant inside Platforming Index, a tool a consulting team gives a manufacturer to cut product complexity. You answer one signed-in user.

USER PROFILE
Role: ${R.name}. This role cares about ${R.lens}
Their survey answers (sample): ${R.beliefs}

RULES
- Answer the question first, in plain language for this role. At most 110 words. Short paragraphs or up to 4 bullets starting with "- ". No headings, no tables, no bold.
- Use only the DATA below. If the data cannot answer, say what is missing. Never invent a number.
- Put an evidence tag right after each number, copied exactly from the DATA: a purchase order tag like [PO450076], or [product_master], [survey], [kearney_survey]. Use at most 4 tags per answer.
- A matched part is a suggestion until engineering approves. A price gap is not booked savings. The index score is provisional. Say so when relevant.
- Do not use em dashes.

DATA
Company: Voltara Power Systems (fictional sample). Period: Nov 2025 to Oct 2026.
Summary: ${PNS} part numbers describe ${PARTS} real parts. ${SHARED.length} parts are shared by 2+ products, ${CORE.length} by 5+ (common core candidates), ${PARTS-SHARED.length} are unique to one product. ${REUSED} part numbers are already reused across products. Yearly parts spend $${SPEND}. Yearly price gap on shared parts if every line paid the lowest price Voltara already pays: $${GAP}. ${REVIEW.length} battery cabinet lines say only "SEE DWG" and wait for engineering review. ${SUPPLIERS} suppliers; ${MULTI} parts have 2+ suppliers.
Platforming Index: 34 of 100, provisional, equal weights. Shared architecture 18, Decision ownership 40 [survey], Incentives 28 [survey], Complexity control 50 (midpoint, no data). Path: step 1 cut cost on current products (now), step 2 consolidate duplicate parts, step 3 common core plus modules for the next generation.
Kearney 2026 survey of 100 manufacturers [kearney_survey]: engineering effort is the top platforming challenge for 43%; 52% of companies platforming at scale have no complexity targets.
Survey disagreements [survey]: Sales says customers need every variant, CFO and Engineering say no. CEO and CFO say Engineering owns architecture; Engineering and Supply chain say nobody does. No function is measured on complexity.
Products [product_master] (id, name, units per year, lead time weeks, sustaining engineering hours per year):
${PM.map(p=>p.join(", ")).join("\n")}
Parts (name | counts | gap | spend :: part number (product, description as written, average unit price, supplier, [purchase order tag])):
${parts}`;
}
function fmt(text){
  const lines = esc(text).replace(/\*\*/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let html = "", inList = false;
  for (const l of lines){
    const li = /^[-•]\s+/.test(l);
    if (li && !inList){ html += "<ul>"; inList = true; }
    if (!li && inList){ html += "</ul>"; inList = false; }
    html += li ? "<li>"+l.replace(/^[-•]\s+/,"")+"</li>" : "<p>"+l+"</p>";
  }
  if (inList) html += "</ul>";
  return html.replace(/\[(PO\d{6})\]/g,(m,po)=>`<button type="button" class="cite" data-po="${po}">${po}</button>`).replace(/\[(product_master|survey|kearney_survey)\]/g,'<span class="src">$1</span>');
}
function drawChat(){
  const R = ROLES[state.role];
  $("#asstRole").textContent = "Answering for " + R.name;
  $("#thread").innerHTML = state.chat.map(m=>`<div class="msg ${m.a?"a":"u"}">${m.h}</div>`).join("");
  $("#sugg").innerHTML = state.chat.length>1 ? "" : R.sugg.map(s=>`<button type="button" class="link" data-sugg="${esc(s)}">${esc(s)}</button>`).join("");
  $("#status").innerHTML = live ? `<span class="dot"></span>Live. Claude writes each answer from the Voltara data and cites its rows.` : `<span class="dot off"></span>Offline mode. Answers come from a fixed set.`;
  $("#askBtn").hidden = state.busy; $("#stopBtn").hidden = !state.busy; $("#askInput").disabled = state.busy;
  const th = $("#thread"); th.scrollTop = th.scrollHeight;
}
function resetChat(){ state.chat = [{ a:1, h:`<p>You are viewing as ${ROLES[state.role].name}. Click a number on the dashboard or ask a question.</p>` }]; state.turns = []; }
function canned(text){
  const t = text.toLowerCase(), C = ROLES.cfo.kpis, E = ROLES.eng.kpis, S = ROLES.sales.kpis, U = ROLES.supply.kpis;
  const k = /capacitor/.test(t) ? C[2] : /fan|premium|cabinet pay/.test(t) ? U[1] : /price|gap|sav|cost|spend|money|pay|negotiat/.test(t) ? C[0]
    : /duplicate|part number|same part/.test(t) ? C[1] : /core|platform|module/.test(t) ? E[2] : /lead|time|week/.test(t) ? S[2]
    : /supplier|vendor/.test(t) ? U[2] : /review|dwg|confiden/.test(t) ? E[3] : /variant|customer|option|remove|unique|go away/.test(t) ? S[0] : /hour|sustain/.test(t) ? E[0] : null;
  return k ? k.why() : `<p>Offline mode answers a fixed set. Try a number on the dashboard, or ask about price gaps, duplicates, the common core, suppliers, or lead time.</p>`;
}
const COPY = { rate_limited:"The assistant is busy. Try again in a moment.", session_expired:"Sign in again to use the live assistant.", refused:"The assistant declined that question. Try rephrasing it.", empty_completion:"No answer came back. Try a simpler question." };
async function ask(text, fallback){
  if (state.busy || !text.trim()) return;
  state.chat.push({ h:esc(text) });
  if (!live){ state.chat.push({ a:1, h: fallback ? fallback() : canned(text) }); drawChat(); return; }
  const bubble = { a:1, h:"<p>Thinking...</p>" }; state.chat.push(bubble); state.busy = true; drawChat();
  state.turns.push({ role:"user", content:text });
  ctl = new AbortController();
  try {
    const res = await sample([{ role:"user", content:context() }, ...state.turns.slice(-8)], { cache:false, modelTier:"quick", signal:ctl.signal, onText:({text:t})=>{ bubble.h = fmt(t); drawChat(); } });
    bubble.h = fmt(res.text); state.turns.push({ role:"assistant", content:res.text });
  } catch (e) {
    state.turns.pop();
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){ live = false; bubble.h = fallback ? fallback() : canned(text); }
    else if (e.code === "cancelled"){ bubble.h = e.text ? fmt(e.text) + "<p>Stopped.</p>" : "<p>Stopped.</p>"; }
    else { bubble.h = (e.text ? fmt(e.text) : "") + "<p>" + (COPY[e.code] || "The answer was interrupted. Ask again.") + "</p>"; }
  }
  state.busy = false; drawChat(); $("#askInput").focus();
}

/* ---------- shell ---------- */
const VIEWS = { "dashboard":vDash, "parts":vParts, "alignment":vAlign, "new-part":vNew };
function render(){
  $("#main").innerHTML = VIEWS[state.view]();
  document.querySelectorAll(".tabs a").forEach(a=>{ if (a.getAttribute("href")==="#"+state.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}
function route(){ const h = location.hash.slice(1); state.view = VIEWS[h] ? h : "dashboard"; render(); }
function evidence(po){
  for (const g of G) for (const r of g.rows) if (r.po===po){
    $("#evBody").innerHTML = `<dl><dt>Part</dt><dd>${esc(g.name)}</dd><dt>Part number</dt><dd class="mono">${esc(r.pn)}</dd><dt>Written as</dt><dd>${esc(r.desc)}</dd><dt>Product</dt><dd>${r.products.join(", ")}</dd><dt>Supplier</dt><dd>${esc(r.supplier)}</dd><dt>Avg unit price</dt><dd>${px(r.price)}</dd><dt>File</dt><dd class="mono">voltara_spend_cube.csv · ${po}</dd></dl>`;
    $("#ev").showModal(); return;
  }
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-po],[data-filter],[data-open],[data-kpi],[data-askpart],[data-sugg],[data-act]"); if (!t) return;
  if (t.dataset.po) return evidence(t.dataset.po);
  if (t.dataset.kpi){ const k = ROLES[state.role].kpis[+t.dataset.kpi]; return ask(k.q, k.why); }
  if (t.dataset.askpart){ const g = G.find(x=>x.id===t.dataset.askpart); return ask(`Why is there a ${usd(g.gap)} yearly price gap on the ${g.name}?`, ()=>`<p>${esc(g.name)} has ${g.rows.length} part numbers across ${g.products} products, priced from ${px(g.min)} to ${px(g.max)}. Paying the lowest price on every line closes a ${usd(g.gap)} yearly gap. ${g.rows.slice(0,3).map(cite).join(" ")}</p>`); }
  if (t.dataset.sugg) return ask(t.dataset.sugg);
  if (t.dataset.filter){ state.filter = t.dataset.filter; state.open=null; }
  else if (t.dataset.open){ state.open = state.open===t.dataset.open ? null : t.dataset.open; }
  else if (t.dataset.act==="ex"){ state.exception=true; }
  else if (t.dataset.act==="reuse"){ state.check.done="Requisition updated to reuse "+state.check.g.rows[0].pn+". No new part number created."; }
  else if (t.dataset.act==="sendEx"){ state.exception=false; state.check.done="Exception sent to the architecture owner for approval."; }
  render();
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if (e.target.id==="askForm"){ const el=$("#askInput"), v=el.value.trim(); el.value=""; ask(v); }
  if (e.target.id==="reqForm"){ const q=$("#reqDesc").value, vol=Math.max(1,+$("#reqVol").value||1); state.check={q,vol,g:match(q)}; state.exception=false; render(); }
});
document.addEventListener("input", e=>{
  if (e.target.id==="partSearch"){ state.q = e.target.value; state.open=null; const pos=e.target.selectionStart; render(); const el=$("#partSearch"); el.focus(); el.setSelectionRange(pos,pos); }
});
$("#roleSel").innerHTML = Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.name}</option>`).join("");
$("#roleSel").addEventListener("change", e=>{ if (ctl) ctl.abort(); state.role = e.target.value; state.busy=false; resetChat(); render(); drawChat(); });
$("#stopBtn").addEventListener("click", ()=>ctl && ctl.abort());
$("#evClose").addEventListener("click", ()=>$("#ev").close());
$("#evStatus").textContent = `${PNS-REVIEW.length} of ${PNS} part numbers matched, ${REVIEW.length} in review`;
window.addEventListener("hashchange", route);
resetChat(); route(); drawChat();
(async()=>{ try { const s = window.claude && window.claude.use ? await window.claude.use("sample") : null; if (s){ sample = s; live = true; drawChat(); } } catch(_){} })();
</script>
